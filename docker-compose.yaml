
services:
  postgis:
      image: postgis/postgis:17-3.5
      container_name: postgis
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin123
        POSTGRES_DB: gis
      ports:
        - "5432:5432"
      volumes:
        - ./pgdata:/var/lib/postgresql/data # store postgres data in attached local folder
      restart: unless-stopped
  postgis-init:
    image: postgis/postgis:17-3.5
    container_name: postgis-init
    depends_on:
      - postgis
    environment:
      PGPASSWORD: admin123
      DOWNLOAD_DUMPS: false
    volumes:
      - ./postgres_init:/postgres_init:ro # initializer scripts
      - /media/abibok/Data4/txdot_fast_pgis:/dumps:ro # Change this to your local folder of database dumps
    entrypoint: ["/bin/bash", "/postgres_init/restore_dumps.sh"]

# geoserver - provides the WFS and WMTS layers, connects directly to the postgis db
  fast-geoserver:
    build: ./geoserver
    container_name: geoserver
    environment:
      WORKFLOWS: ds_sr da_sr_nc nwm_sr nwm_sr_nc
      # GEOSERVER_AUTH: admin:txdot # use secrets in deployment
      GEOSERVER_URL: http://localhost:8080/geoserver
      DESIRED_ADMIN_USER: txdot_admin
      DESIRED_ADMIN_PASS: txdot_geoserver
      PG_HOST: postgis
      PG_PORT: "5432"
      PG_DB: TXFull
      PG_USER: admin # use secrets in deployment
      PG_PASS: admin123 # use secrets in deployment
      STABLE_EXTENSION: gdal,wps,css,postgis,postgresql,sql
      CORS_ENABLED: "true"
      CORS_ALLOWED_METHODS: GET,POST,PUT,HEAD,OPTIONS
      VIEWER_USER: viewer # use secrets in deployment
      VIEWER_PASS: txdot # use secrets in deployment
    ports:
      - "8080:8080"
    volumes:
      - ./geoserver_data:/opt/geoserver/data_dir
    depends_on:
      - postgis
      - postgis-init
    restart: unless-stopped

