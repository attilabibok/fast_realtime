  fast-worker:
    build:
      context: .
      dockerfile: fast-worker/Dockerfile
    container_name: fast-worker
    depends_on:
      - postgis
    environment:
      DB_PASSWORD: admin123
      #FAST_S3_ACCESS_KEY_ID: 
      #FAST_S3_SECRET_ACCESS_KEY:
    volumes:
      - ./output:/fast_realtime/output   # attach folder to see the outputs on the host machine
      - ./data:/fast_realtime/data       # attach folder to see the outputs on the host machine
      - ./src:/fast_realtime/src         # mount src folder
      - ./inputs:/fast_realtime/inputs   # mount inputs folder
      - ./sql:/fast_realtime/sql         # mount sql folder
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]
    restart: on-failure

volumes:
  postgis_data: