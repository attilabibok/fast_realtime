# ------- Real-time using HAND -------------
[database]
username = admin
# -- if password = 'xxx', python will pull from 'DB_PASSWORD' envionment variable
host = postgis
port = 5432
dbname = 06_ODA_realtime_hand

# -----------------------
[flow_from_nwm]
# -- for step 1A
# For grabbing flow directly from NWM s3 bucket 'noaa-nwm-pds'
texas_faeture_id_list = /fast_realtime/inputs/texas_feature_ids.csv
force = true

# -----------------------
[download]
# -- for step 1B
# For grabbing flows from KISTERs
url = https://knatempstorage.s3.us-west-1.amazonaws.com/nwm_txdot_output/short_range/valid_comids_texas_streamflow.nc
download_dir = /tmp

[bridge_warnings]
enabled = true
# -----------------------
[sql]
# -- for step 2
sql_file_path = /fast_realtime/sql/roadflood_create_dynamic_tables_big.sql

[local_results]
output_folder = /fast_realtime/output/06_ODA
# -----------------------
[write_to_s3]
; # -- for step 4
publish_live = true
publish_bucket = knatempstorage
publish_sub_folder = fast_realtime/nwm/06-ODA
publish_historic = true
publish_historic_bucket = knatempstorage
publish_historic_sub_folder = fast_historic/nwm/06-ODA

# Enable or disable product outputs
publish_roads = true
publish_bridges = true
publish_inundation = true

# Enable esrijson output
publish_esri_json = true